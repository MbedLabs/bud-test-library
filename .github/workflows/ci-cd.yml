name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: budtestlibrary-dist
          path: dist/*

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: budtestlibrary-dist
          path: dist/

      - name: Install publish tooling
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to pip.embedlabs.de
        env:
          TWINE_USERNAME: ${{ secrets.PIP_INDEX_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PIP_INDEX_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ secrets.PIP_REPOSITORY_URL }}
        run: |
          python -m twine upload dist/*
