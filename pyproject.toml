[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budtestlibrary"
version = "0.3.0"
description = "Universal Bud Test Automation Framework for Hardware-in-Loop, Software-in-the-Loop, Web-Apps, Mobile, Cloud, and End-to-End Testing. Created by EmbedLabs."
readme = "README.md"
license = "AGPL-3.0"
authors = [
    {name = "EmbedLabs", email = "dev@embedlabs.net"}
]
maintainers = [
    {name = "EmbedLabs", email = "dev@embedlabs.net"}
]
keywords = [
    "testing",
    "automation",
    "hardware-in-loop",
    "software-in-the-loop",
    "IoT-Edge-Testing",
    "Web-Apps-Testing",
    "Mobile-Testing",
    "Cloud-Testing",
    "API-Testing",
    "System-Testing",
    "Security-Testing",
    "Performance-Testing",
    "Load-Testing",
    "Distributed-Systems-Testing",
    "SaaS-Validation",
    "CI-CD-Integration",
    "End-to-End Testing",
    "Bud",
    "Test-Framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://embedlabs.de"
Documentation = "https://embedlabs.de/docs"
Changelog = "https://embedlabs.de/docs"
Support = "https://embedlabs.de"

[tool.setuptools.packages.find]
where = ["."]
include = ["budtestlibrary*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["budtestlibrary"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "B024",
    "B027",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=budtestlibrary --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["budtestlibrary"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
